services:
  backend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    # We use 'sh -c' to run a sequence of commands.
    # 1. Install/update Python packages from requirements.txt.
    # 2. If successful (&&), then start the Uvicorn server.
    # The app path is now relative to the new working_dir.
    command: >
      sh -c "uvicorn backend.app.main:app --reload --workers 1 --host 0.0.0.0 --port ${GEQNMR_BACKEND_PORT:-8273}"
    volumes:
      - .:/workspaces/GEqNMR
      - ${GEQNMR_DATA_ROOT:-./outputs}:${GEQNMR_DATA_ROOT:-/workspaces/GEqNMR/outputs}
    ports:
      - "127.0.0.1:${GEQNMR_BACKEND_PORT:-8273}:${GEQNMR_BACKEND_PORT:-8273}"
    # Set the working directory to the project root.
    # This makes Python imports consistent.
    working_dir: /workspaces/GEqNMR
    depends_on:
      - redis
    environment:
      GEQNMR_DATA_ROOT: ${GEQNMR_DATA_ROOT:-/workspaces/GEqNMR/outputs}
      GEQNMR_MODELS_DIR: ${GEQNMR_MODELS_DIR:-/workspaces/GEqNMR/models}
      GEQNMR_FRONTEND_PORT: ${GEQNMR_FRONTEND_PORT:-5273}
    tty: true

  frontend:
    image: node:20-alpine
    # MODIFICATION:
    # Same principle as the backend.
    # 1. Install/update Node.js packages from package.json.
    # 2. If successful (&&), then start the Vite dev server.
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0 --port ${GEQNMR_FRONTEND_PORT:-5273}"
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:${GEQNMR_FRONTEND_PORT:-5273}:${GEQNMR_FRONTEND_PORT:-5273}"
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:${GEQNMR_BACKEND_PORT:-8273}}
    tty: true

  redis:
    image: redis:alpine
    # No port mapping needed for redis, it's only used internally
